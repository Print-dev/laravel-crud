version: '3.8'

services:
  # ============================================
  # BACKEND: PHP-FPM + Laravel
  # ============================================
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mini_crud_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=mini_crud
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mini_crud_network

  # ============================================
  # SERVIDOR WEB: Nginx
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: mini_crud_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - mini_crud_network

  # ============================================
  # BASE DE DATOS: MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: mini_crud_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=mini_crud
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mini_crud_network

  # ============================================
  # FRONTEND: Node + Vite
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: mini_crud_frontend
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - mini_crud_network

volumes:
  mysql_data:
    driver: local

networks:
  mini_crud_network:
    driver: bridge